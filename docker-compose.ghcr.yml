# Local stack that runs the image CI already built and published, instead of
# building one from this checkout.
#
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Pin a specific build by exporting IMAGE_TAG before running, e.g.
#   IMAGE_TAG=40b4ef17a0a2a0f0d3bdfc3ab2410659dc2e7c67    (bash)
#   $env:IMAGE_TAG="40b4ef17a0a2a0f0d3bdfc3ab2410659dc2e7c67"   (PowerShell)
#
# The package is public, so no docker login is required.
services:
  api:
    image: ghcr.io/gauravsharmalinux/cats-vs-dogs-mlops:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: cvd-api
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "ghcr-${IMAGE_TAG:-latest}"
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: cvd-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri file:///mlruns
      --default-artifact-root file:///mlruns

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: cvd-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.5.1
    container_name: cvd-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
